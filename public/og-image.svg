<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  
  <!-- Subtle Gradient Glows -->
  <circle cx="200" cy="150" r="300" fill="#10B981" fill-opacity="0.12" filter="blur(100px)"/>
  <circle cx="1000" cy="480" r="350" fill="#06B6D4" fill-opacity="0.10" filter="blur(120px)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Grid Pattern -->
  <g opacity="0.15">
    <line x1="80" y1="80" x2="1120" y2="80" stroke="#ffffff" stroke-dasharray="4 8"/>
    <line x1="80" y1="200" x2="1120" y2="200" stroke="#ffffff" stroke-dasharray="4 8"/>
    <line x1="80" y1="320" x2="1120" y2="320" stroke="#ffffff" stroke-dasharray="4 8"/>
    <line x1="80" y1="440" x2="1120" y2="440" stroke="#ffffff" stroke-dasharray="4 8"/>
    <line x1="80" y1="560" x2="1120" y2="560" stroke="#ffffff" stroke-dasharray="4 8"/>
  </g>

  <!-- Brand Watermark -->
  <text x="80" y="110" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#10B981" letter-spacing="1">
    ABDALRHMAN.DEV // PRODUCTION READY
  </text>

  <!-- Name -->
  <text x="80" y="240" font-family="'Cairo', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">
    عبدالرحمن عبده
  </text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="'Cairo', system-ui, sans-serif" font-size="38" font-weight="700" fill="#34D399">
    Full-Stack &amp; Back-End Software Engineer
  </text>

  <!-- Description -->
  <text x="80" y="380" font-family="'Cairo', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    هندسة منصات SaaS متعددة المستأجرين (Multi-Tenancy) · تكاملات ZATCA · Laravel 12 · Go
  </text>

  <!-- Badges Container -->
  <g transform="translate(80, 460)">
    <!-- Badge 1: Laravel -->
    <rect x="0" y="0" width="160" height="48" rx="12" fill="#16202C" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="80" y="30" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#E9D5FF" text-anchor="middle">
      PHP / Laravel
    </text>

    <!-- Badge 2: Go -->
    <rect x="180" y="0" width="150" height="48" rx="12" fill="#16202C" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="255" y="30" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#A5F3FC" text-anchor="middle">
      Go (Golang)
    </text>

    <!-- Badge 3: Multi-Tenancy -->
    <rect x="350" y="0" width="190" height="48" rx="12" fill="#16202C" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="445" y="30" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">
      Multi-Tenancy
    </text>

    <!-- Badge 4: React / TS -->
    <rect x="560" y="0" width="190" height="48" rx="12" fill="#16202C" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="655" y="30" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#BFDBFE" text-anchor="middle">
      React / TypeScript
    </text>
  </g>

  <!-- Stat Counter Box on Right -->
  <g transform="translate(880, 180)">
    <rect width="240" height="320" rx="20" fill="#111720" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="120" y="70" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#10B981" text-anchor="middle">
      +75
    </text>
    <text x="120" y="105" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle">
      مشروع ومنصة منجزة
    </text>

    <line x1="30" y1="135" x2="210" y2="135" stroke="#ffffff" stroke-opacity="0.1"/>

    <text x="120" y="180" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#06B6D4" text-anchor="middle">
      +6
    </text>
    <text x="120" y="215" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle">
      سنوات خبرة في الإنتاج
    </text>

    <line x1="30" y1="245" x2="210" y2="245" stroke="#ffffff" stroke-opacity="0.1"/>

    <text x="120" y="285" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#34D399" text-anchor="middle">
      100% On-Time Delivery
    </text>
  </g>
</svg>
